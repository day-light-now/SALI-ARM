/**/controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: false
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    slaihand_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/joint_state_broadcaster:
  ros__parameters:
    joints: [slaihand_joint1, slaihand_joint2, slaihand_joint3, slaihand_joint4, slaihand_joint5]

/**/slaihand_joint_trajectory_controller:
  ros__parameters:
    joints: [slaihand_joint1, slaihand_joint2, slaihand_joint3, slaihand_joint4, slaihand_joint5]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false
    interpolate_from_desired_state: true
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      # Operator request 2026-11-08: five-axis trajectory following tolerance
      # widened from 4 deg to 10 deg while keeping the 1 deg goal tolerance.
      # 8 deg was still exceeded by a loaded J1 at ~9.1 deg.  This is a
      # following-error abort limit, not a torque limit.
      slaihand_joint1: {trajectory: 0.17453292519943295, goal: 0.017453292519943295}
      slaihand_joint2: {trajectory: 0.17453292519943295, goal: 0.017453292519943295}
      slaihand_joint3: {trajectory: 0.17453292519943295, goal: 0.017453292519943295}
      slaihand_joint4: {trajectory: 0.17453292519943295, goal: 0.017453292519943295}
      slaihand_joint5: {trajectory: 0.17453292519943295, goal: 0.017453292519943295}
