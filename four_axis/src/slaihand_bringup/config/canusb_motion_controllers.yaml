/**/controller_manager:
  ros__parameters:
    update_rate: 100
    # The generic position limiter differentiates desired minus MEASURED pose.
    # A stationary native-MIT gravity offset is not a reference velocity: that
    # limiter would rewrite a hold target and cause an actual reference jump.
    # The native driver validates every reference step (0.5rad/s), measured
    # speed (1rad/s), following error (4deg), and final encoded URDF bounds.
    # compile_plan independently validates the full quintic reference speed.
    enforce_command_limits: false
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    slaihand_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/joint_state_broadcaster:
  ros__parameters:
    joints: [slaihand_joint1, slaihand_joint2, slaihand_joint3, slaihand_joint4]

/**/slaihand_joint_trajectory_controller:
  ros__parameters:
    joints: [slaihand_joint1, slaihand_joint2, slaihand_joint3, slaihand_joint4]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    open_loop_control: false
    interpolate_from_desired_state: true
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      slaihand_joint1: {trajectory: 0.06981317007977318, goal: 0.017453292519943295}
      slaihand_joint2: {trajectory: 0.06981317007977318, goal: 0.017453292519943295}
      slaihand_joint3: {trajectory: 0.06981317007977318, goal: 0.017453292519943295}
      slaihand_joint4: {trajectory: 0.06981317007977318, goal: 0.017453292519943295}
